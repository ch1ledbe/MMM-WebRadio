<!doctype html>
<html>
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>MMM-WebRadio</title>
  <style>
    :root{
      --gap: 10px;
      --pad: 14px;
      --radius: 14px;
      --bg: #ffffff;
      --fg: #111111;
      --muted: #666666;
      --card-bg: #ffffff;
      --border: #dddddd;
      --btn-bg: #f7f7f7;
      --btn-fg: #111111;
      --input-bg: #ffffff;
      --input-fg: #111111;
      --hr: #eeeeee;
      --pill-bg: #fafafa;
      --accent: #2f5fe0;
    }

    body{
      font-family: system-ui, -apple-system, Segoe UI, Roboto, sans-serif;
      margin: 0;
      padding: 14px;
      background: var(--bg);
      color: var(--fg);
    }

    *, *::before, *::after {
      box-sizing: border-box;
    }

    .card{
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: var(--pad);
      max-width: 720px;
      margin: 0 auto;
      background: var(--card-bg);
    }

    .muted{ color: var(--muted); }

    .row{
      display:flex;
      gap: var(--gap);
      flex-wrap: wrap;
      align-items: center;
    }

    /* Inputs/buttons: better touch targets */
    select, input[type="range"], input[type="number"], input[type="text"], button, textarea{
      font-size: 16px;
    }

    button{
      cursor: pointer;
      padding: 12px 14px;
      border-radius: 12px;
      border: 1px solid var(--border);
      background: var(--btn-bg);
      color: var(--btn-fg);
      min-height: 44px; /* iOS tap target */
    }
    button:active{ transform: scale(0.99); }

    select, input[type="number"], input[type="text"], textarea{
      padding: 12px 12px;
      border-radius: 12px;
      border: 1px solid var(--border);
      min-height: 44px;
      background: var(--input-bg);
      color: var(--input-fg);
    }

    input[type="range"]{
      width: 100%;
      height: 44px;
    }

    textarea{
      border-radius: 12px;
      border: 1px solid var(--border);
      padding: 12px;
      width: 100%;
      box-sizing: border-box;
    }

    img{
      max-height: 70px;
      max-width: 200px;
      object-fit: contain;
    }

    hr{
      border: 0;
      border-top: 1px solid var(--hr);
      margin: 14px 0;
    }

    /* Layout helpers */
    .grow{ flex: 1 1 auto; min-width: 180px; }
    .full{ flex: 1 1 100%; }
    .btn-group{ display:flex; gap: var(--gap); flex-wrap: nowrap; }
    .btn-group button{ flex: 1 1 0; }

    .status-grid{
      display: grid;
      grid-template-columns: auto 1fr;
      gap: 6px 10px;
      align-items: center;
      width: 100%;
    }

    .logo-line{
      display:flex;
      gap: 12px;
      align-items: center;
      width: 100%;
    }

    .pill{
      display:inline-block;
      padding: 6px 10px;
      border: 1px solid var(--border);
      border-radius: 999px;
      background: var(--pill-bg);
      font-size: 13px;
      color: var(--fg);
    }

    @media (prefers-color-scheme: dark){
      :root{
        --bg: #0b0c0f;
        --fg: #e9e9ea;
        --muted: #a7a7ad;
        --card-bg: #12141a;
        --border: #2a2f3a;
        --btn-bg: #1a1f29;
        --btn-fg: #e9e9ea;
        --input-bg: #0f131b;
        --input-fg: #e9e9ea;
        --hr: #232a36;
        --pill-bg: #161b24;
        --accent: #3a6ff7;
      }

      /* nicer focus ring on dark */
      button:focus, select:focus, input:focus, textarea:focus{
        outline: 2px solid #3a6ff7;
        outline-offset: 2px;
      }

      /* range slider on dark (basic) */
      input[type="range"]{
        accent-color: #3a6ff7;
      }
    }

    .module-title{
      font-weight: 700;
      font-size: 18px;
      margin-bottom: 12px;
      text-align: left;
      letter-spacing: 0.3px;
    }

    .status-stack{
      display: flex;
      flex-direction: column;
      gap: 4px;
      min-width: 0; /* IMPORTANT for wrapping */
    }

    .station-name{
      font-weight: 600;
      font-size: 16px;
      line-height: 1.2;
    }

    .song-title{
      font-size: 14px;
      line-height: 1.25;
      word-break: break-word;
      overflow-wrap: anywhere;
      white-space: normal;
      color: var(--fg);
    }

    .meta-line{
      display: flex;
      gap: 10px;
      align-items: center;
      font-size: 13px;
      color: var(--muted);
    }

    .timer-at-row{
      flex-wrap: wrap;
    }

    .timer-label{
      font-size: 14px;
      white-space: nowrap;
    }

    #timerMin{
      width: auto;      /* let flex decide */
      flex: 1 1 auto;   /* grow/shrink inside row */
      min-width: 0;     /* important to avoid overflow in flex */
    }

    .time-input{
      min-height: 44px;
      padding: 10px 12px;
      border-radius: 12px;
      border: 1px solid var(--border);
      background: var(--input-bg);
      color: var(--input-fg);
    }

    /* Scheduler window editor */
    .win-list{
      display: flex;
      flex-direction: column;
      gap: 10px;
      margin-bottom: 10px;
    }

    .win{
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 12px;
      background: var(--pill-bg);
      display: flex;
      flex-direction: column;
      gap: 10px;
    }

    .win-head{
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 10px;
    }

    .win-title{ font-weight: 600; font-size: 14px; }

    .win-remove{
      min-height: 36px;
      padding: 6px 12px;
      font-size: 14px;
    }

    .days{
      display: flex;
      gap: 6px;
      flex-wrap: wrap;
    }

    .day{ position: relative; }
    .day input{
      position: absolute;
      opacity: 0;
      width: 1px;
      height: 1px;
    }
    .day span{
      display: inline-flex;
      align-items: center;
      justify-content: center;
      min-width: 44px;
      min-height: 40px;
      padding: 0 10px;
      border: 1px solid var(--border);
      border-radius: 999px;
      background: var(--btn-bg);
      color: var(--btn-fg);
      font-size: 14px;
      cursor: pointer;
      user-select: none;
    }
    .day input:checked + span{
      background: var(--accent);
      border-color: var(--accent);
      color: #ffffff;
    }
    .day input:focus-visible + span{
      outline: 2px solid var(--accent);
      outline-offset: 2px;
    }

    .presets{
      display: flex;
      gap: 6px;
      flex-wrap: wrap;
    }
    .presets button{
      min-height: 32px;
      padding: 4px 10px;
      font-size: 13px;
      border-radius: 999px;
    }

    .win-times{
      display: flex;
      gap: 10px;
      align-items: center;
      flex-wrap: wrap;
    }
    .win-times label{ font-size: 14px; color: var(--muted); }

    .win-hint{ font-size: 13px; color: var(--muted); }

    .win-empty{
      font-size: 14px;
      color: var(--muted);
      padding: 12px;
      border: 1px dashed var(--border);
      border-radius: 12px;
      text-align: center;
    }

    /* Prevent iOS from forcing weird input colors */
    input, textarea, select, button{
      -webkit-tap-highlight-color: transparent;
    }

    /* Mobile-specific improvements */
    @media (max-width: 520px){
      body{ padding: 10px; }
      .card{ padding: 12px; }

      #logo{ max-width: 90px; }

      /* Station row becomes stacked: select full width, buttons full width */
      .row.station-row{ flex-direction: column; align-items: stretch; }
      .row.station-row label{ display:none; }
      #stations{ width: 100%; }

      /* Transport buttons: big & evenly spaced */
      .btn-group{
        width: 100%;
      }

      /* Volume row stacked */
      .row.volume-row{ flex-direction: column; align-items: stretch; }
      .row.volume-row label{ display:none; }
      #volumeVal{ font-weight: 600; }

      /* Timer row stacked */
      .row.timer-row{ flex-direction: column; align-items: stretch; }
      .row.timer-row label{
        display: block;
        font-size: 13px;
        color: var(--muted);
        margin-bottom: 4px;
      }

      .timer-at-row{
        flex-direction: column;
        align-items: stretch;
      }

      .timer-label{
        font-size: 13px;
      }

      /* Scheduler windows: time inputs stacked */
      .win-times{ flex-direction: column; align-items: stretch; }
      .win-times .time-input{ width: 100%; }

      /* Fit all seven day chips in one row */
      .days{ gap: 4px; }
      .day span{ min-width: 36px; padding: 0 4px; font-size: 13px; }
    }

    @media (max-width: 520px) and (orientation: portrait){
      .module-title{ font-size: 17px; }
      .station-name{ font-size: 17px; }
      .song-title{ font-size: 15px; }
    }

    /* Mobile landscape: normalize font sizes */
    @media (max-width: 900px) and (orientation: landscape){
      .module-title{ font-size: 16px; }
      .station-name{ font-size: 16px; }
      .song-title{ font-size: 14px; }
      .meta-line{font-size: 13px;}
    }

  </style>
</head>
<body>
  <div class="card">
    <div class="module-title">MMM-WebRadio</div>
    <div id="authBox" style="display:none">
      <p class="muted">This Web UI expects a token. Enter it once:</p>
      <div class="row">
        <input id="token" placeholder="Token" />
        <button onclick="saveToken()">Save</button>
      </div>
      <hr />
    </div>

    <div class="row station-row">
      <label>Station</label>
      <select id="stations" class="grow"></select>

      <div class="btn-group full">
        <button onclick="prev()">◀︎</button>
        <button onclick="play()">Play</button>
        <button onclick="stop()">Stop</button>
        <button onclick="next()">▶︎</button>
      </div>
    </div>

    <div class="row volume-row" style="margin-top:12px">
      <label>Volume</label>
      <div class="full">
        <input id="volume" type="range" min="0" max="100" value="60" oninput="setVolume(this.value)" />
        <div class="muted" style="margin-top:6px">Volume: <span id="volumeVal">60</span>%</div>
      </div>
    </div>

   <hr />

    <div class="row timer-row" style="margin-top:12px">
      <label>Sleep timer (minutes)</label>
      <input id="timerMin" type="number" min="0" max="1440" value="0" class="grow" />
      <div class="btn-group full">
        <button onclick="setTimer()">Set</button>
        <button onclick="clearTimer()">Off</button>
      </div>
    </div>


    <hr />

    <div class="logo-line">
      <img id="logo" style="display:none" />

      <div class="status-stack">
        <div class="station-name" id="stationName">-</div>

        <div class="song-title" id="title">
          -
        </div>

        <div class="meta-line">
          <span id="status">-</span>
          <span class="muted" id="timerInfo"></span>
        </div>
      </div>
    </div>


    <hr />

    <h3>Scheduler</h3>

    <label>
      <input type="checkbox" id="schEnabled">
      Enabled
    </label><br/>

    <label>
      <input type="checkbox" id="schAutoStart">
      Auto-start inside window
    </label><br/>

    <label>
      <input type="checkbox" id="schStopOutside">
      Stop outside window
    </label><br/>

    <div class="row timer-at-row">
      <label for="schSleepAt" class="timer-label">Sleep at</label>
      <input type="time" id="schSleepAt" class="time-input" />
    </div>


    <p>Playback windows:</p>
    <div id="schWindows" class="win-list"></div>
    <button id="schAddWindow" class="full" style="width:100%" onclick="addWindow()">+ Add window</button>

    <div class="btn-group full" style="margin-top:10px">
      <button onclick="loadSchedule()">Reload</button>
      <button onclick="saveSchedule()">Save</button>
    </div>
    <p id="schStatus" class="pill"></p>

  </div>

<script>
  const API = (path) => path;
  (() => {
    const params = new URLSearchParams(window.location.search);
    const t = params.get("token");
    if (t && t.trim()) localStorage.setItem("mmm_webradio_token", t.trim());
    if (params.has("token")) {
      // Drop the token from the address bar so it doesn't end up in history/bookmarks
      params.delete("token");
      const qs = params.toString();
      history.replaceState(null, "", window.location.pathname + (qs ? "?" + qs : "") + window.location.hash);
    }
  })();
  const getToken = () => localStorage.getItem("mmm_webradio_token") || "";
  const headers = () => {
    const t = getToken();
    return t ? { "Content-Type": "application/json", "X-MMM-WebRadio-Token": t } : { "Content-Type": "application/json" };
  };

  async function apiGet(path) {
    const res = await fetch(API(path), { headers: headers() });
    return res.json();
  }

  async function apiPost(path, body) {
    const res = await fetch(API(path), {
      method: "POST",
      headers: headers(),
      body: JSON.stringify(body || {})
    });
    return res.json();
  }

  function saveToken() {
    localStorage.setItem("mmm_webradio_token", document.getElementById("token").value.trim());
    document.getElementById("authBox").style.display = "none";
    init();
  }

  async function init() {
    const st = await apiGet("/api/stations");
    if (!st.ok && st.error === "unauthorized") {
      document.getElementById("authBox").style.display = "block";
      return;
    }
    const sel = document.getElementById("stations");
    sel.innerHTML = "";
    st.stations.forEach(s => {
      const opt = document.createElement("option");
      opt.value = s.index;
      opt.textContent = s.name;
      sel.appendChild(opt);
    });

    sel.onchange = async () => {
      await apiPost("/api/play", { index: parseInt(sel.value, 10) });
      await refresh();
    };

    await refresh();
    await loadSchedule();
    setInterval(refresh, 1500);
  }

  async function refresh() {
    const res = await apiGet("/api/state");
    if (!res.ok) return;

    const s = res.state;
    document.getElementById("status").textContent = s.playing ? "Playing" : "Stopped";
    document.getElementById("title").textContent = s.title || "(no metadata)";
    document.getElementById("stations").value = s.stationIndex;
    document.getElementById("stationName").textContent =
    document.getElementById("stations").selectedOptions[0]?.textContent || "";


    document.getElementById("volume").value = s.volume;
    document.getElementById("volumeVal").textContent = s.volume;

    const logo = document.getElementById("logo");
    if (s.logoUrl) {
      logo.src = s.logoUrl;
      logo.style.display = "block";
    } else {
      logo.style.display = "none";
    }

    const timerInfo = document.getElementById("timerInfo");
    if (s.sleepTimerEndsAt) {
      const mins = Math.max(0, Math.ceil((s.sleepTimerEndsAt - Date.now()) / 60000));
      timerInfo.textContent = `Timer: ${mins} min remaining`;
    } else {
      timerInfo.textContent = "";
    }
  }

  async function play() {
    const idx = parseInt(document.getElementById("stations").value, 10);
    await apiPost("/api/play", { index: idx });
    await refresh();
  }
  async function stop() {
    await apiPost("/api/stop");
    await refresh();
  }
  async function next() {
    await apiPost("/api/next");
    await refresh();
  }
  async function prev() {
    await apiPost("/api/prev");
    await refresh();
  }
  async function setVolume(v) {
    document.getElementById("volumeVal").textContent = v;
    await apiPost("/api/volume", { volume: parseInt(v, 10) });
  }
  async function setTimer() {
    const m = parseInt(document.getElementById("timerMin").value, 10) || 0;
    await apiPost("/api/timer", { minutes: m });
    await refresh();
  }
  async function clearTimer() {
    await apiPost("/api/timer", { minutes: 0 });
    await refresh();
  }
  async function loadSchedule() {
    const out = document.getElementById("schStatus");
    out.textContent = "Loading...";
    const r = await apiGet("/api/schedule");
    if (!r.ok) { out.textContent = "Error loading schedule"; return; }

    const s = r.schedule || {};
    document.getElementById("schEnabled").checked = !!s.enabled;
    document.getElementById("schAutoStart").checked = (s.autoStartInsideWindow !== false);
    document.getElementById("schStopOutside").checked = !!s.stopOutsideWindow;
    document.getElementById("schSleepAt").value = s.sleepAt || "";

    const windows = Array.isArray(s.windows) ? s.windows : [];
    schWindows = windows
      .filter(w => w && typeof w === "object")
      .map(w => ({
        days: Array.isArray(w.days) ? w.days.filter(d => Number.isInteger(d) && d >= 0 && d <= 6) : [],
        start: typeof w.start === "string" ? w.start.padStart(5, "0") : "",
        end: typeof w.end === "string" ? w.end.padStart(5, "0") : ""
      }));
    renderWindows();

    out.textContent = "Loaded.";
  }

  // --- Scheduler window editor ---
  const MAX_WINDOWS = 50;
  // Display order Mon..Sun; values follow JS getDay() (0 = Sunday)
  const DAYS = [
    { value: 1, label: "Mon" }, { value: 2, label: "Tue" }, { value: 3, label: "Wed" },
    { value: 4, label: "Thu" }, { value: 5, label: "Fri" }, { value: 6, label: "Sat" },
    { value: 0, label: "Sun" }
  ];
  const DAY_PRESETS = [
    { label: "Weekdays", days: [1, 2, 3, 4, 5] },
    { label: "Weekend", days: [6, 0] },
    { label: "Every day", days: [] }
  ];
  let schWindows = [];

  function addWindow() {
    if (schWindows.length >= MAX_WINDOWS) return;
    schWindows.push({ days: [1, 2, 3, 4, 5], start: "07:00", end: "08:00" });
    renderWindows();
  }

  function removeWindow(i) {
    schWindows.splice(i, 1);
    renderWindows();
  }

  function windowHint(w) {
    const parts = [];
    if (!w.days.length) parts.push("Every day (no day selected).");
    if (w.start && w.end) {
      if (w.start === w.end) parts.push("Start = end: plays all day.");
      else if (w.end < w.start) parts.push("Overnight: ends the next day.");
    }
    return parts.join(" ");
  }

  function renderWindows() {
    const list = document.getElementById("schWindows");
    list.innerHTML = "";

    if (!schWindows.length) {
      const empty = document.createElement("div");
      empty.className = "win-empty";
      empty.textContent = "No windows yet. Add one to define when the radio may play.";
      list.appendChild(empty);
    }

    schWindows.forEach((w, i) => {
      const card = document.createElement("div");
      card.className = "win";

      // Header: title + remove
      const head = document.createElement("div");
      head.className = "win-head";
      const title = document.createElement("div");
      title.className = "win-title";
      title.textContent = "Window " + (i + 1);
      const del = document.createElement("button");
      del.className = "win-remove";
      del.type = "button";
      del.textContent = "Remove";
      del.setAttribute("aria-label", "Remove window " + (i + 1));
      del.onclick = () => removeWindow(i);
      head.appendChild(title);
      head.appendChild(del);

      const hint = document.createElement("div");
      hint.className = "win-hint";
      const updateHint = () => {
        hint.textContent = windowHint(w);
        hint.hidden = !hint.textContent;
      };

      // Day toggles
      const days = document.createElement("div");
      days.className = "days";
      days.setAttribute("role", "group");
      days.setAttribute("aria-label", "Days");
      const dayInputs = [];
      DAYS.forEach(d => {
        const lab = document.createElement("label");
        lab.className = "day";
        const cb = document.createElement("input");
        cb.type = "checkbox";
        cb.checked = w.days.includes(d.value);
        cb.onchange = () => {
          w.days = DAYS.filter((x, k) => dayInputs[k].checked).map(x => x.value);
          updateHint();
        };
        const span = document.createElement("span");
        span.textContent = d.label;
        lab.appendChild(cb);
        lab.appendChild(span);
        days.appendChild(lab);
        dayInputs.push(cb);
      });

      // Day presets
      const presets = document.createElement("div");
      presets.className = "presets";
      DAY_PRESETS.forEach(p => {
        const b = document.createElement("button");
        b.type = "button";
        b.textContent = p.label;
        b.onclick = () => {
          w.days = p.days.slice();
          DAYS.forEach((d, k) => { dayInputs[k].checked = w.days.includes(d.value); });
          updateHint();
        };
        presets.appendChild(b);
      });

      // Start / end times
      const times = document.createElement("div");
      times.className = "win-times";
      [["start", "From"], ["end", "To"]].forEach(([key, text]) => {
        const id = `win-${i}-${key}`;
        const lab = document.createElement("label");
        lab.htmlFor = id;
        lab.textContent = text;
        const inp = document.createElement("input");
        inp.type = "time";
        inp.id = id;
        inp.className = "time-input";
        inp.value = w[key];
        inp.oninput = () => { w[key] = inp.value; updateHint(); };
        times.appendChild(lab);
        times.appendChild(inp);
      });

      card.appendChild(head);
      card.appendChild(days);
      card.appendChild(presets);
      card.appendChild(times);
      card.appendChild(hint);
      updateHint();
      list.appendChild(card);
    });

    const add = document.getElementById("schAddWindow");
    add.disabled = schWindows.length >= MAX_WINDOWS;
    add.textContent = add.disabled ? `Maximum of ${MAX_WINDOWS} windows reached` : "+ Add window";
  }

  async function saveSchedule() {
    const out = document.getElementById("schStatus");

    const incomplete = schWindows.findIndex(w => !w.start || !w.end);
    if (incomplete !== -1) {
      out.textContent = `Window ${incomplete + 1}: please set both times.`;
      return;
    }
    const windows = schWindows.map(w => ({ days: w.days.slice(), start: w.start, end: w.end }));

    out.textContent = "Saving...";

    const schedule = {
      enabled: document.getElementById("schEnabled").checked,
      autoStartInsideWindow: document.getElementById("schAutoStart").checked,
      stopOutsideWindow: document.getElementById("schStopOutside").checked,
      sleepAt: document.getElementById("schSleepAt").value.trim(),
      windows
    };

    const r = await apiPost("/api/schedule", { schedule });
    out.textContent = r.ok ? "Saved." : ("Save failed: " + (r.error || "unknown"));
  }

  init();
</script>
</body>
</html>
