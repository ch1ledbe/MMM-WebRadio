version: 2
updates:
  # NPM dependencies (MagicMirror module)
  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "monthly"
      day: "monday"
      time: "06:00"
      timezone: "Europe/Zurich"
    open-pull-requests-limit: 3

    # Keep PRs tidy and easy to scan
    labels:
      - "dependencies"
      - "maintenance"
    commit-message:
      prefix: "chore(deps)"

    # Reduce noise: bundle everything into one PR
    groups:
      all-dependencies:
        patterns:
          - "*"

    # Conservative by default: avoid breaking users on older MM/Node
    ignore:
      - dependency-name: "*"
        update-types:
          - "version-update:semver-major"

    # Keep PRs fresh without manual babysitting
    rebase-strategy: "auto"

  # GitHub Actions (if you add workflows later, this keeps them up to date too)
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "monthly"
      day: "monday"
      time: "06:00"
      timezone: "Europe/Zurich"
    open-pull-requests-limit: 2
    labels:
      - "ci"
      - "maintenance"
    commit-message:
      prefix: "chore(ci)"
    rebase-strategy: "auto"
